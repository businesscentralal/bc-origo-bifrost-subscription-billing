name: Help Links

# Every page must link to a context-sensitive help page that exists on the documentation site
# (businesscentralal/bifrost) in both en-US and is-IS. Merge the documentation change first when a PR
# adds or renames a page.

on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'tools/Test-HelpLinks.ps1'
      - '.github/workflows/HelpLinks.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  HelpLinks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout documentation site
        uses: actions/checkout@v4
        with:
          repository: businesscentralal/bifrost
          ref: main
          path: docs-site

      - name: Verify help links
        shell: pwsh
        run: ./tools/Test-HelpLinks.ps1 -DocsPath ./docs-site
